<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Заявка отправлена — Подача</title>
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon.png">
  <style>
    :root{--ink:#07111f;--navy:#0b1c30;--blue:#124a78;--acid:#d9ff43;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 20%,#174e78 0,transparent 36%),var(--navy);color:var(--white);font:16px/1.55 Inter,Arial,sans-serif}.card{width:min(620px,calc(100% - 32px));padding:clamp(34px,7vw,68px);border:1px solid #ffffff28;border-radius:28px;background:#ffffff0b;box-shadow:0 28px 80px #0005}.ball{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--acid);color:var(--ink);font-size:36px;font-weight:900}h1{font-size:clamp(42px,8vw,70px);line-height:.95;letter-spacing:-.055em;margin:28px 0 20px}p{font-size:20px;color:#d8e3eb;margin:0 0 30px}.actions{display:flex;gap:12px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;padding:15px 20px;border-radius:999px;text-decoration:none;font-weight:900}.primary{background:var(--acid);color:var(--ink)}.secondary{border:1px solid #ffffff45;color:#fff}@media(max-width:520px){.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="ball">✓</div>
    <h1>Спасибо за заявку!</h1>
    <p>Сообщение отправлено тренеру. Мы свяжемся с вами, чтобы уточнить удобное время и формат занятия.</p>
    <div class="actions">
      <a class="button primary" href="/">Вернуться на главную</a>
      <a class="button secondary" href="tel:+79232807088">Позвонить тренеру</a>
    </div>
  </main>
</body>
</html>
